kind = "web"
previewPath = "/"
title = "ClimaBuild AI"
version = "1.0.0"
id = "artifacts/eui-predictor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 5173
name = "web"
paths = ["/"]

[services.development]
run = "cd /home/runner/workspace/frontend && npm run dev"

[services.env]
PORT = "5173"

[services.production]
build = ["pnpm", "--filter", "@workspace/eui-predictor", "run", "build"]
publicDir = "artifacts/eui-predictor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
